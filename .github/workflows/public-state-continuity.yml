name: Public state continuity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read

jobs:
  verify-public-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe advertised public surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/public-state
          base="https://www.lultrills.com"
          cache_bust="continuity=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          paths=(
            "/"
            "/trillsverse"
            "/system-breach"
            "/machine-entry"
            "/work-with-john"
            "/.well-known/ai.txt"
            "/architecture.json"
            "/corpus.json"
            "/corpus.md"
            "/corpus.txt"
            "/llms-full.txt"
            "/trillsverse-property.json"
            "/inject"
            "/robots.txt"
            "/sitemap.xml"
          )
          for path in "${paths[@]}"; do
            safe=$(printf '%s' "$path" | sed 's#^/##; s#[/.]#_#g')
            [ -n "$safe" ] || safe="root"
            echo "GET ${base}${path}"
            curl --fail --silent --show-error --location \
              --retry 2 --retry-delay 2 \
              --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -D "/tmp/public-state/${safe}.headers" \
              "${base}${path}?${cache_bust}" -o "/tmp/public-state/${safe}"
          done

      - name: Verify machine corpus convergence
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('/tmp/public-state')
          corpus = json.loads((root / 'corpus_json').read_text())
          architecture = json.loads((root / 'architecture_json').read_text())
          property_manifest = json.loads((root / 'trillsverse-property_json').read_text())
          corpus_md = (root / 'corpus_md').read_text()
          corpus_txt = (root / 'corpus_txt').read_text()
          llms = (root / 'llms-full_txt').read_text()
          inject = (root / 'inject').read_text()
          home = (root / 'root').read_text().lower()
          offer = (root / 'work-with-john').read_text().lower()
          trillsverse = (root / 'trillsverse').read_text().lower()
          system_breach = (root / 'system-breach').read_text().lower()

          corpus_id = corpus.get('corpusId')
          manifest_hash = corpus.get('manifestHash')
          assert corpus_id, 'corpus.json missing corpusId'
          assert manifest_hash, 'corpus.json missing manifestHash'
          assert f'CORPUS_ID={corpus_id}' in llms, 'llms-full corpusId disagrees with corpus.json'
          assert f'MANIFEST_SHA256={manifest_hash}' in llms, 'llms-full manifest hash disagrees with corpus.json'

          legend = corpus.get('epistemicLegend', {})
          assert 'narrative_canon' in legend, 'current narrative canon category missing'
          assert 'lore' not in legend, 'legacy narrative category still active in machine schema'

          for name, projection in {
            'corpus.md': corpus_md,
            'corpus.txt': corpus_txt,
            'llms-full.txt': llms,
          }.items():
            assert 'epistemic_type: lore' not in projection, f'{name} still emits legacy active narrative type'
            assert 'SCOPE=One request. Entire public brain.' not in projection, f'{name} still overclaims entire-public-brain scope'
            assert 'STATUS: Historical receipt snapshot; scope language superseded on 2026-09-08.' in projection, f'{name} lost historical supersession evidence'

          lowered = inject.lower()
          assert 'current machine corpus' in lowered, '/inject is not using current-corpus framing'
          assert 'entire public brain' not in lowered, '/inject still overclaims entire-public-brain scope'
          assert 'full public brain' not in trillsverse, '/trillsverse still overclaims full-public-brain scope'
          assert 'music, lore, runtime, doctrine' not in system_breach, '/system-breach still exposes obsolete active terminology'

          # Deployment-drift guards: current source must not silently fall behind production.
          for stale_marker in (
            'docs=30',
            'words=37613',
            'version=2026-08-10-intelligence-recognition-lock',
          ):
            assert stale_marker not in home, f'homepage still exposes stale corpus marker: {stale_marker}'
          assert 'make your website clear about who you are.' in offer, '/work-with-john is not serving the current acquisition surface'

          assert property_manifest.get('id') == 'TV-PROPERTY-LULTRILLS', 'Lultrills property manifest has wrong or missing property id'
          state_sources = property_manifest.get('stateSources', [])
          assert any(source.get('url', '').endswith('/corpus.json') for source in state_sources), 'property manifest lost corpus.json state source'

          docs = corpus.get('documents', [])
          assert len(docs) == corpus.get('documentCount'), 'documentCount disagrees with documents array'
          assert isinstance(architecture, dict) and architecture, 'architecture.json is empty or invalid'
          assert architecture.get('topologyVersion') == '2026-09-08', 'architecture topologyVersion is stale'
          print(f"verified corpusId={corpus_id} documents={len(docs)} architecture_keys={len(architecture)} property={property_manifest.get('id')}")

      - name: Preserve public-state receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/public-state/
          if-no-files-found: warn
          retention-days: 30
