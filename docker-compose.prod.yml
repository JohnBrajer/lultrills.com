services:
  web:
    build: .
    restart: unless-stopped
    volumes:
      - offer-inquiries:/app/data/inquiries
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      APP_COMMIT_SHA: "${APP_COMMIT_SHA:-UNKNOWN}"
      APP_DEPLOYED_AT: "${APP_DEPLOYED_AT:-UNKNOWN}"

volumes:
  offer-inquiries:
