name: Deploy to Cloudflare (free tier)

on:
  push:
    branches: [John]
  schedule:
    - cron: "17 9 * * *" # daily rebuild refreshes corpus timestamps
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        run: node scripts/build-static.mjs
        env:
          APP_COMMIT_SHA: ${{ github.sha }}
      - name: Deploy worker + assets
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: >
          npx wrangler deploy
          --var APP_COMMIT_SHA:${{ github.sha }}
          --var APP_DEPLOYED_AT:$(date -u +%Y-%m-%dT%H:%M:%SZ)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Token missing
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::warning::Add the CLOUDFLARE_API_TOKEN repo secret to enable deploys. Build succeeded."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
