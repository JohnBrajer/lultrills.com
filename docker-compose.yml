version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lultrills-com
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    # Add your secrets via .env or DO secrets later
    # env_file:
    #   - .env.production

  # Optional: Add nginx reverse proxy later for custom domain + SSL
