name: Verify Root source

on:
  push:
    branches: [John]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify custom-quote intake
        run: node scripts/test-inquiries.mjs
      - name: Guard active machine terminology
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number --fixed-string 'Full public brain' app/trillsverse app/inject
          ! grep -R --line-number --fixed-string 'music, lore, runtime, doctrine' app/system-breach
          grep -q --fixed-string 'narrative_canon' app/corpus.json/route.ts
          grep -q --fixed-string 'normalizeMachineCorpusDocument' app/corpus.json/route.ts
          grep -q --fixed-string 'normalizeMachineCorpusDocument' app/llms-full.txt/route.ts
      - name: Guard canonical corpus source terminology and scope
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n --fixed-string '| "lore"' lib/corpus.ts
          ! grep -n --fixed-string 'return "lore"' lib/corpus.ts
          ! grep -n --fixed-string 'lore: "Worldbuilding or metaphysical narrative framing."' lib/corpus.ts
          ! grep -n --fixed-string 'full brain in one GET' lib/corpus.ts
          ! grep -n --fixed-string 'Entire public brain' lib/corpus.ts
          grep -q --fixed-string '| "narrative_canon"' lib/corpus.ts
          grep -q --fixed-string 'registered public machine corpus in one GET' lib/corpus.ts
          grep -q --fixed-string 'Current registered public machine corpus. Manifest defines included documents.' lib/corpus.ts
          grep -q --fixed-string 'ORIGINAL CLAIM (preserved): Public portal ships instant injection, full brain in one GET' lib/corpusProjection.ts
      - name: Guard first historical claim-authority migrations
        shell: bash
        run: |
          set -euo pipefail
          grep -q --fixed-string '"injection-procedure": assertCorpusAuthorityEnvelope' lib/corpusProjection.ts
          grep -q --fixed-string '"systemic-cognitive-overwrites": assertCorpusAuthorityEnvelope' lib/corpusProjection.ts
          grep -q --fixed-string 'evidenceClass: "unverified_inference"' lib/corpusProjection.ts
          grep -q --fixed-string 'preservedText:' lib/corpusProjection.ts
      - name: Guard persona-era Fragment supersession
        shell: bash
        run: |
          set -euo pipefail
          grep -q --fixed-string 'id: "injection-procedure-persona-state"' lib/corpusProjection.ts
          grep -q --fixed-string 'selector: "The subject begins feeling the personas as internal states."' lib/corpusProjection.ts
          grep -q --fixed-string 'id: "injection-procedure-persona-signatures"' lib/corpusProjection.ts
          grep -q --fixed-string 'selector: "The Persona Injection Signatures"' lib/corpusProjection.ts
          grep -q --fixed-string 'id: "injection-procedure-persona-embodiment"' lib/corpusProjection.ts
          grep -q --fixed-string 'supersededBy: CURRENT_FRAGMENT_AUTHORITY' lib/corpusProjection.ts
          grep -q --fixed-string '**Fragments:** Lultrills, Kasano, Ace, and John B.' content/doctrine/intelligence-injections-origin.md
          grep -q --fixed-string 'older sources may use persona as historical terminology.' lib/corpus.ts
          grep -q --fixed-string 'Do not perform a global `persona` → `Fragment` replacement.' docs/authority/persona-era-fragment-migration.md
      - name: Guard aggregate current-authority collisions
        shell: bash
        run: |
          set -euo pipefail
          grep -q --fixed-string 'assertNoCompetingCurrentAuthority' lib/corpusProjection.ts
          grep -q --fixed-string 'assertNoCompetingCurrentAuthority(Object.values(HISTORICAL_AUTHORITY))' lib/corpusProjection.ts
